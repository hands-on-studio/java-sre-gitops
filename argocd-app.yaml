apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: java-sre
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hands-on-studio/java-sre-gitops.git
    targetRevision: main
    path: app
  destination:
    server: https://kubernetes.default.svc
    namespace: java-sre
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
